##############################################
#                                            #
#           Superfile Configuration          #
#                                            #
##############################################

# This contains the hotkey config file for superfile! More details can be found at
# https://superfile.dev/configure/custom-hotkeys/.
#
# Keymap mirrors ~/.config/yazi/keymap.toml where superfile has an equivalent
# action. superfile has no key chords (gg, cc, ,m ...), no history back/forward,
# no top/bottom jump and no invert-selection, so those yazi bindings are omitted.

###############################################################################
#                                Global hotkeys                               #
###############################################################################

# Note: These hotkeys should be unique.

#-- Basic Actions
confirm = ['enter', 'right', 'l']
cd_quit = ['Q', '']
quit = ['q', 'esc']

#-- Navigation
list_down = ['down', 'j']
list_up = ['up', 'k']
page_down = ['ctrl+f', 'ctrl+d']
page_up = ['ctrl+b', 'ctrl+u']

#-- File Panel Controls (yazi tabs)
close_file_panel = ['ctrl+c', '']
create_new_file_panel = ['n', '']
next_file_panel = [']', 'tab', 'L']
open_sort_options_menu = [',', '']
pinned_directory = ['P', '']
previous_file_panel = ['[', 'shift+tab', 'H']
split_file_panel = ['t', '']
toggle_file_preview_panel = ['T', '']
toggle_reverse_sort = ['R', '']

#-- Focus Manipulation
focus_on_metadata = ['m', '']
focus_on_process_bar = ['w', '']
focus_on_sidebar = ['s', '']

#-- File/Dir Creation/Renaming
file_panel_item_create = ['a', '']
file_panel_item_rename = ['r', '']

#-- Main File Operations
copy_items = ['y', '']
cut_items = ['x', '']
delete_items = ['d', 'delete']
paste_items = ['p', '']
permanently_delete_items = ['D', '']

#-- Archive Manipulation
compress_file = ['C', '']
extract_file = ['ctrl+e', '']

#-- Editor Actions
open_current_directory_with_editor = ['E', '']
open_file_with_editor = ['e', '']

#-- Other Actions
change_panel_mode = ['v', '']
copy_path = ['c', '']
copy_present_working_directory = ['Y', '']
open_command_line = [':', ';']
open_help_menu = ['~', '?']
open_spf_prompt = ['>', '']
open_zoxide = ['Z', 'z']
toggle_dot_file = ['.', '']
toggle_footer = ['F', '']

###############################################################################
#                                Typing hotkeys                               #
###############################################################################

# Note: These hotkeys can override all hotkeys.

confirm_typing = ['enter', '']
cancel_typing = ['ctrl+c', 'esc']

###############################################################################
#                            Mode-Specific Hotkeys                            #
###############################################################################

# Note: These hotkeys can conflict with other modes, but not with global
# hotkeys.

#-- Normal Mode Actions
parent_directory = ['h', 'left', 'backspace']
search_bar = ['/', 'f']

#-- Selection Mode Actions
file_panel_select_mode_items_select_down = ['shift+down', 'J']
file_panel_select_mode_items_select_up = ['shift+up', 'K']
file_panel_select_all_items = ['ctrl+a', '']
