# Terminal
set -g default-terminal 'tmux-256color'
set -as terminal-features ',xterm-ghostty:RGB:usstyle:sync:extkeys'
set -as terminal-features ',*:RGB'

# Options
set -s escape-time 0
set -s extended-keys on
set -g mouse on
set -g history-limit 10000
set -g focus-events on
set -g set-clipboard on
set -g detach-on-destroy off
setw -g aggressive-resize on

# Numbering
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Prefix
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Splits
unbind %
unbind '"'
bind c   new-window      -c '#{pane_current_path}'
bind '\' split-window -h -c '#{pane_current_path}'
bind -   split-window -v -c '#{pane_current_path}'

# Navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind Tab last-window

# Resize
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind m resize-pane -Z

# Copy mode
setw -g mode-keys vi
bind -T copy-mode-vi v   send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y   send -X copy-pipe-and-cancel 'xclip -selection clipboard'
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel 'xclip -selection clipboard'

# Reload
unbind r
bind r source-file ~/.tmux.conf \; display-message "󰑓 Config reloaded!"

# Status bar
set -g status-position bottom
set -g status-justify 'absolute-centre'
set -g status-left-length 100
set -g status-right-length 200
set -g status-interval 5

# Battery detection
if-shell 'for battery in /sys/class/power_supply/BAT*; do [ -d "$battery" ] && exit 0; done; exit 1' \
  'set -g @battery_enabled 1' \
  'set -g @battery_enabled 0'

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-cpu'
if-shell '[ "#{@battery_enabled}" = "1" ]' \
  "set -g @plugin 'tmux-plugins/tmux-battery'"
set -g @plugin 'catppuccin/tmux'

# Persistence
set -g @continuum-save-interval '15'
set -g @continuum-restore 'on'
set -g @continuum-boot 'off'

# Catppuccin
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style 'rounded'
set -g @catppuccin_window_text ' #W'
set -g @catppuccin_window_current_text ' #W'
set -g @catppuccin_date_time_icon "󰸗 "
set -g @catppuccin_date_time_text " %a %d/%m 󰥔 %H:%M"

# Load plugins
run '~/.tmux/plugins/tpm/tpm'

set -g  status-left  '#{E:@catppuccin_status_session}#{E:@catppuccin_status_directory}'
if-shell '[ "#{@battery_enabled}" = "1" ]' \
  "set -gF status-right '#{E:@catppuccin_status_cpu}#{E:@catppuccin_status_ram}#{E:@catppuccin_status_battery}#{E:@catppuccin_status_date_time}'" \
  "set -gF status-right '#{E:@catppuccin_status_cpu}#{E:@catppuccin_status_ram}#{E:@catppuccin_status_date_time}'"

set -gF message-style         'fg=#{@thm_teal},bg=#{@thm_surface_1},align=left,fill=#{@thm_surface_1}'
set -gF message-command-style 'fg=#{@thm_teal},bg=#{@thm_surface_1},align=left,fill=#{@thm_surface_1}'

# Load status modules
run '~/.tmux/plugins/tmux-cpu/cpu.tmux'
if-shell '[ "#{@battery_enabled}" = "1" ]' \
  "run '~/.tmux/plugins/tmux-battery/battery.tmux'"
