# Terminal
set -g default-terminal 'tmux-256color'
set -as terminal-features ',alacritty*:RGB:usstyle:sync'
set -as terminal-features ',xterm-kitty:RGB:usstyle:sync'
set -as terminal-features ',xterm*:extkeys'

# Behavior
set -s escape-time 0
set -s extended-keys on
set -g focus-events on                          # nvim autoread, gitsigns cần
set -g mouse on
set -g history-limit 10000
set -g set-clipboard on                         # OSC 52: copy về clipboard host kể cả qua SSH
set -g detach-on-destroy off                    # window cuối đóng → switch session thay vì detach
setw -g aggressive-resize on

# Index từ 1, tự dồn số sau khi đóng window
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Prefix C-a
unbind C-b
set -g prefix C-a
bind C-a send-prefix                            # bấm 2 lần để gửi literal C-a

# Windows & Panes
unbind %
unbind '"'
bind c   new-window      -c '#{pane_current_path}'
bind '\' split-window -h -c '#{pane_current_path}'
bind -   split-window -v -c '#{pane_current_path}'

# Pane navigation vi-style
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R                           # đè default last-window của 'l'
bind Tab last-window                            # bù lại last-window

# Pane resize (-r: repeat trong repeat-time)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind m resize-pane -Z

# Copy mode (vi)
setw -g mode-keys vi
bind -T copy-mode-vi v   send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y   send -X copy-pipe-and-cancel 'xclip -selection clipboard'
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel 'xclip -selection clipboard'

# Reload
unbind r
bind r source-file ~/.tmux.conf \; display-message "󰑓 Config reloaded!"

# Status bar (phần không phụ thuộc catppuccin)
set -g status-position bottom
set -g status-justify 'centre'
set -g status-left-length 100
set -g status-right-length 100
set -g status-interval 5                        # nhịp refresh cpu/ram/battery (giây)

# Plugins (TPM)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'catppuccin/tmux'

# Continuum: auto-save 15p (default). Restore thủ công: prefix + Ctrl-r
# set -g @continuum-restore 'on'

# Catppuccin
set -g @catppuccin_flavor 'mocha'               # latte | frappe | macchiato | mocha
set -g @catppuccin_window_status_style 'rounded'
set -g @catppuccin_window_text ' #W'
set -g @catppuccin_window_current_text ' #W'
set -g @catppuccin_battery_text " #{l:#(~/.tmux/plugins/tmux-battery/scripts/battery_percentage.sh | tr -d %)}%"
set -g @catppuccin_date_time_icon "󰸗 "
set -g @catppuccin_date_time_text " %a %d/%m 󰥔 %H:%M"

# TPM init — phải chạy TRƯỚC status-left/right (dùng biến catppuccin)
run '~/.tmux/plugins/tpm/tpm'

# Status bar segments (sau TPM)
set -g  status-left  '#{E:@catppuccin_status_session}#{E:@catppuccin_status_directory}'
set -gF status-right '#{E:@catppuccin_status_cpu}#{E:@catppuccin_status_ram}#{E:@catppuccin_status_battery}#{E:@catppuccin_status_date_time}'

# Load Plugins
run '~/.tmux/plugins/tmux-cpu/cpu.tmux'
run '~/.tmux/plugins/tmux-battery/battery.tmux'
