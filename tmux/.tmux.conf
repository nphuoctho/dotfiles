# Terminal
set -g default-terminal 'tmux-256color'
set -as terminal-features ',xterm-ghostty:RGB:usstyle:sync:extkeys'  # Truecolor + undercurl + sync cho ghostty
set -as terminal-features ',*:RGB'                                   # Fallback cho terminal khác

# Behavior
set -s escape-time 0
set -s extended-keys on         # Ctrl/Alt mở rộng cho nvim
set -g mouse on
set -g history-limit 10000
set -g focus-events on          # Cho nvim autoread + gitsigns
set -g set-clipboard on         # OSC 52, copy sang clipboard host (cả SSH)
set -g detach-on-destroy off    # Window cuối đóng thì nhảy session, không detach
setw -g aggressive-resize on    # Resize theo client đang xem

# Đánh số từ 1, tự dồn khi đóng window
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Prefix C-a
unbind C-b
set -g prefix C-a
bind C-a send-prefix            # Bấm 2 lần để gửi C-a thật

# Split giữ nguyên thư mục
unbind %
unbind '"'
bind c   new-window      -c '#{pane_current_path}'
bind '\' split-window -h -c '#{pane_current_path}'
bind -   split-window -v -c '#{pane_current_path}'

# Chuyển pane kiểu vim
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R           # Đè last-window mặc định của l
bind Tab last-window            # Dời last-window sang Tab

# Resize pane (-r giữ phím lặp)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind m resize-pane -Z           # Zoom pane

# Copy mode vim, yank ra clipboard
setw -g mode-keys vi
bind -T copy-mode-vi v   send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y   send -X copy-pipe-and-cancel 'xclip -selection clipboard'
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel 'xclip -selection clipboard'

# Reload config
unbind r
bind r source-file ~/.tmux.conf \; display-message "󰑓 Config reloaded!"

# Status bar
set -g status-position bottom
set -g status-justify 'absolute-centre'  # Window list chính giữa màn hình (bỏ qua độ dài left/right)
set -g status-left-length 100
set -g status-right-length 200
set -g status-interval 5        # Refresh module mỗi 5s

# Chỉ hiện pin trên máy có battery device (thường là laptop); desktop sẽ ẩn pin.
if-shell 'for battery in /sys/class/power_supply/BAT*; do [ -d "$battery" ] && exit 0; done; exit 1' \
  'set -g @battery_enabled 1' \
  'set -g @battery_enabled 0'

# Plugins (TPM)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-cpu'          # Cấp #{cpu_percentage}, #{ram_percentage}
if-shell '[ "#{@battery_enabled}" = "1" ]' \
  "set -g @plugin 'tmux-plugins/tmux-battery'"
set -g @plugin 'catppuccin/tmux'

# Catppuccin
set -g @catppuccin_flavor 'mocha'               # Flavor: latte | frappe | macchiato | mocha
set -g @catppuccin_window_status_style 'rounded'
set -g @catppuccin_window_text ' #W'
set -g @catppuccin_window_current_text ' #W'
set -g @catppuccin_battery_text " #{l:#(~/.tmux/plugins/tmux-battery/scripts/battery_percentage.sh | tr -d %)}%"
set -g @catppuccin_date_time_icon "󰸗 "
set -g @catppuccin_date_time_text " %a %d/%m 󰥔 %H:%M"

# TPM chạy trước status-left/right (mấy dòng đó dùng biến catppuccin)
run '~/.tmux/plugins/tpm/tpm'

set -g  status-left  '#{E:@catppuccin_status_session}#{E:@catppuccin_status_directory}'
if-shell '[ "#{@battery_enabled}" = "1" ]' \
  "set -gF status-right '#{E:@catppuccin_status_cpu}#{E:@catppuccin_status_ram}#{E:@catppuccin_status_battery}#{E:@catppuccin_status_date_time}'" \
  "set -gF status-right '#{E:@catppuccin_status_cpu}#{E:@catppuccin_status_ram}#{E:@catppuccin_status_date_time}'"

# Nền đặc + full-width để prompt (rename…) không đè status bar
set -gF message-style         'fg=#{@thm_teal},bg=#{@thm_surface_1},align=left,fill=#{@thm_surface_1}'
set -gF message-command-style 'fg=#{@thm_teal},bg=#{@thm_surface_1},align=left,fill=#{@thm_surface_1}'

# Chạy sau status-right để tmux-cpu thay #{cpu_percentage}… bằng script
run '~/.tmux/plugins/tmux-cpu/cpu.tmux'
if-shell '[ "#{@battery_enabled}" = "1" ]' \
  "run '~/.tmux/plugins/tmux-battery/battery.tmux'"
